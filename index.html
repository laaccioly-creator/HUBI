<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme-preference') || localStorage.getItem('hubi_theme_preference');
          var isMobile = window.innerWidth < 768 || /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          var theme = (saved === 'dark' || saved === 'light') ? saved : (isMobile ? 'light' : 'dark');
          var root = document.documentElement;
          if (theme === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.colorScheme = 'light';
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
        } catch(e) {}
      })();
    </script>
    <title>HUBI - Gestão e Vendas</title>
    <meta name="description" content="Sistema multiplataforma de ponto de vendas (PDV), controle de estoque com variações, catálogo online, controle de fiado e finanças para pequenos lojistas." />
    <meta property="og:title" content="HUBI - Gestão e Vendas" />
    <meta property="og:description" content="Sistema multiplataforma de ponto de vendas (PDV), controle de estoque com variações, catálogo online, controle de fiado e finanças para pequenos lojistas." />

    <!-- Ocultar barra do navegador e ativar modo App / Fullscreen no Mobile (Android e iOS) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HUBI" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <!-- Manifesto PWA para instalação como Aplicativo Standalone / WebAPK (sem barra do Chrome) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Mercado Pago SDK v2 (Modal Checkout Pro) -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
